[package]
name = "ibverbs-sys"
version = "0.3.2+63.0"
edition = "2021"
rust-version = "1.82" # unsafe extern in generated bindings

description = "Raw, FFI bindings for RDMA ibverbs through rdma-core"
readme = "../README.md"
authors = [
    "Jon Gjengset <jon@thesquareplanet.com>",
    "Jonathan Behrens <fintelia@gmail.com>"
]
build = "build.rs"
links = "ibverbs"

homepage = "https://github.com/jonhoo/rust-ibverbs"
repository = "https://github.com/jonhoo/rust-ibverbs.git"

keywords = ["rdma", "ibverbs", "networking", "ffi"]
categories = ["network-programming", "api-bindings"]

license = "MIT OR Apache-2.0"

exclude = ["vendor/rdma-core/build/"]

[package.metadata.docs.rs]
# so docs.rs shows the rdmacm and efadv bindings too
all-features = true

[features]
# Use the bindings committed under `src/prebuilt/` instead of running the
# vendored rdma-core cmake build and bindgen, removing cmake, libclang, and
# libnl from the build-time requirements. Applies only to targets with a
# committed bindings file, loses to an explicit `RDMA_CORE_INCLUDE_DIR`, and
# does not cover `efa`/`rdmacm` (whose bindings are not pre-generated);
# anything else falls back to bindgen.
prebuilt-bindings = []
# Bind and link the EFA provider direct-verbs (`efadv`), for AWS Elastic Fabric Adapter SRD queue
# pairs. Requires `libefa` at build and run time.
efa = []
# Bind and link the RDMA connection manager (`librdmacm`, `rdma_cma.h`). Requires `librdmacm` at
# build and run time.
rdmacm = []

[build-dependencies]
bindgen = "0.72"
cmake = "0.1.50"

# to make -Zminimal-versions work
[target.'cfg(any())'.dependencies]
# https://github.com/rust-lang/rust-bindgen/pull/3048
proc-macro2 = { version = "1.0.80", optional = true }
